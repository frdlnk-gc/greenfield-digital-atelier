name: Website SEO and publishing health
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/recruiting-costs.test.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/sync_blog.py --check
      - run: python3 scripts/seo_check.py --freshness
      - run: python3 scripts/check_indexing.py
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/seo_check.py --live --freshness --weekly-due
          python3 scripts/check_indexing.py --live
